name: Suggest an idea
description: A feature, a change to one of the designs, or support for another light or player.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Say what you are trying to do, not only the feature. Glowtrack is deliberately light on CPU, which is a hard requirement.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What do you do today instead?
